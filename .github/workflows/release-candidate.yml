name: Release candidate gates

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: release_static
        continue-on-error: true
        run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:secrets
      - run: npm run test:contracts
      - run: npm run test:unit -- --pool=threads --maxWorkers=2 --no-file-parallelism
      - run: npm run test:integration -- --pool=threads --maxWorkers=2 --no-file-parallelism
      - run: npm run test:performance
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_ENABLE_MOCK_DATA: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-release-evidence
          path: |
            playwright-report
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce release static gate
        if: always()
        run: test "${{ steps.release_static.outcome }}" = "success"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: release-ci-public-placeholder
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000

  release-summary:
    if: always()
    needs: [web, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all required jobs
        run: |
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.mobile.result }}" = "success"
